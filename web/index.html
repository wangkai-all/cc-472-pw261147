<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据质量执行器 · Pointwise DQ</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d26; --panel2: #1e2632; --border: #2a3543;
    --text: #d7dee8; --muted: #8595a8; --accent: #4f9cf9; --accent-dim: #2b5ea7;
    --green: #3fb96b; --red: #e5534b; --amber: #d29922; --purple: #a371f7;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--panel); }
  header h1 { font-size: 18px; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  nav { display: flex; gap: 4px; padding: 0 28px; background: var(--panel); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--muted); padding: 13px 18px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 24px 28px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card h2 { font-size: 14.5px; margin-bottom: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .card h3 { font-size: 13px; color: var(--muted); margin: 14px 0 8px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 9px 11px; font-size: 13px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent-dim); }
  textarea { font-family: var(--mono); font-size: 12.5px; resize: vertical; min-height: 120px; }
  button.btn { background: var(--accent-dim); color: #fff; border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  button.btn:hover { background: var(--accent); }
  button.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button.btn.ghost:hover { color: var(--text); border-color: var(--muted); }
  button.btn.green { background: rgba(63,185,107,.18); color: var(--green); border: 1px solid rgba(63,185,107,.4); }
  button.btn.red { background: rgba(229,83,75,.15); color: var(--red); border: 1px solid rgba(229,83,75,.4); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 550; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid rgba(42,53,67,.6); vertical-align: top; }
  tr:hover td { background: rgba(79,156,249,.05); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .pill.open, .pill.draft, .pill.block, .pill.still_failing, .pill.quarantined, .pill.re_quarantined { background: rgba(229,83,75,.15); color: var(--red); }
  .pill.fixed, .pill.published, .pill.pass { background: rgba(63,185,107,.15); color: var(--green); }
  .pill.archived, .pill.warn, .pill.ingest { background: rgba(210,153,34,.15); color: var(--amber); }
  .pill.replay { background: rgba(163,113,247,.18); color: var(--purple); }
  .pill.type { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  code, .mono { font-family: var(--mono); font-size: 12px; color: #a5d6ff; word-break: break-all; }
  pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; color: var(--text); }
  .muted { color: var(--muted); }
  .stat { font-size: 26px; font-weight: 700; }
  .stat.red { color: var(--red); } .stat.green { color: var(--green); } .stat.amber { color: var(--amber); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 12px 18px; border-radius: 8px; max-width: 420px; font-size: 13px; z-index: 99; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .toast.error { border-left-color: var(--red); }
  .toast.ok { border-left-color: var(--green); }
  .timeline { list-style: none; border-left: 2px solid var(--border); margin-left: 8px; padding-left: 16px; }
  .timeline li { position: relative; padding: 6px 0; }
  .timeline li::before { content: ""; position: absolute; left: -23px; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-dim); border: 2px solid var(--bg); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 640px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 14px; font-size: 15px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .section-gap { margin-top: 22px; }
  .empty { text-align: center; color: var(--muted); padding: 34px 0; font-size: 13px; }
  .scrollx { overflow-x: auto; }
  .badge-count { background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; padding: 1px 7px; margin-left: 4px; }
  .gate-banner { border-radius: 10px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .gate-banner.pass { background: rgba(63,185,107,.1); border: 1px solid rgba(63,185,107,.35); }
  .gate-banner.block { background: rgba(229,83,75,.09); border: 1px solid rgba(229,83,75,.35); }
  .gate-banner.warn { background: rgba(210,153,34,.09); border: 1px solid rgba(210,153,34,.35); }
  .gate-banner .big { font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>🛡️ 数据质量执行器</h1>
  <span class="sub">Pointwise DQ · 规则版本化 / 隔离分区 / 失败回放 / 发布门禁</span>
  <span style="flex:1"></span>
  <button class="btn ghost" id="btn-demo">载入演示数据</button>
  <button class="btn ghost" id="btn-refresh">↻ 刷新</button>
</header>
<nav id="tabs">
  <button data-tab="ingest" class="active">① 数据接入</button>
  <button data-tab="rules">② 规则版本</button>
  <button data-tab="quarantine">③ 隔离分区</button>
  <button data-tab="batches">④ 修复批次</button>
  <button data-tab="gate">⑤ 发布门禁</button>
</nav>
<main id="view"></main>
<div id="toast-host"></div>
<div id="modal-host"></div>
<script src="/static/app.js"></script>
</body>
</html>
